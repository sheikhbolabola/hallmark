name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: References, gates, fixtures, versions and links agree
        run: node skills/hallmark/scripts/refcheck.mjs
      - name: Sloplint CLI and redesign preservation regressions
        run: node --test skills/hallmark/scripts/sloplint.test.mjs
      - name: Image generation cache regressions
        run: node --test skills/hallmark/scripts/fixtures/imagegen/*.test.mjs
      - name: Every theme validates
        run: node skills/hallmark/scripts/theme.mjs validate skills/hallmark/references/themes/*.md
      - name: The theme index is current
        run: |
          node skills/hallmark/scripts/theme.mjs index
          node -e "const fs = require('node:fs'); const cp = require('node:child_process'); const assert = require('node:assert/strict'); const path = 'skills/hallmark/references/themes/index.json'; const committed = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:' + path], { encoding: 'utf8' })); const generated = JSON.parse(fs.readFileSync(path, 'utf8')); delete committed.built; delete generated.built; assert.deepEqual(generated, committed);"
